var WarehouseLeaseTemplate={"version": "warehouse-lease-2026-11-12", "title": "สัญญาเช่าอาคารโกดังสินค้า", "sourceName": "สัญญาเช่าโกดังสินค้า_ฉบับสำหรับลงนาม(1).docx", "sourceSha256": "bb3ec17426603b34dc846669cca679080bf0ea5ac30f926a3476ef375875c39f", "paragraphs": [{"index": 0, "text": "สัญญาเช่าอาคารโกดังสินค้า"}, {"index": 1, "text": "สัญญาฉบับสำหรับลงนาม  •  ให้กรอกข้อมูลและตรวจเอกสารแนบท้ายให้ครบถ้วนก่อนลงนาม"}, {"index": 2, "text": "ทำที่ ....................................................................................."}, {"index": 3, "text": "วันที่ .............. เดือน ........................................ พ.ศ. ................"}, {"index": 4, "text": "สัญญานี้ทำขึ้นระหว่าง"}, {"index": 5, "text": "ผู้ให้เช่า ชื่อ/บริษัท ........................................................................................ เลขประจำตัวประชาชน/เลขทะเบียนนิติบุคคล ................................................ ที่อยู่ .................................................................................................................................................................... โดย ........................................................................ ผู้มีอำนาจลงนาม (ถ้ามี) ซึ่งต่อไปนี้เรียกว่า “ผู้ให้เช่า”"}, {"index": 6, "text": "กับ"}, {"index": 7, "text": "ผู้เช่า ชื่อ/บริษัท ........................................................................................ เลขประจำตัวประชาชน/เลขทะเบียนนิติบุคคล ................................................ ที่อยู่ .................................................................................................................................................................... โดย ........................................................................ ผู้มีอำนาจลงนาม (ถ้ามี) ซึ่งต่อไปนี้เรียกว่า “ผู้เช่า”"}, {"index": 8, "text": "คู่สัญญาตกลงกันตามเงื่อนไขดังต่อไปนี้"}, {"index": 9, "text": "ข้อ 1  ทรัพย์สินที่ให้เช่า"}, {"index": 10, "text": "1.1  ผู้ให้เช่าตกลงให้เช่า และผู้เช่าตกลงเช่าอาคารโกดัง ห้องเลขที่ ............ ตั้งอยู่ที่ ........................................................................................ พื้นที่ประมาณ ............ ตารางเมตร พร้อมสิ่งอำนวยความสะดวกตามเอกสารแนบท้าย"}, {"index": 11, "text": "1.2  ผู้ให้เช่ารับรองว่าตนมีสิทธิโดยชอบในการนำทรัพย์สินดังกล่าวออกให้เช่า"}, {"index": 12, "text": "1.3  แผนผังพื้นที่ ภาพถ่ายสภาพอาคาร รายการอุปกรณ์ และบันทึกการส่งมอบที่คู่สัญญารับรองร่วมกัน ถือเป็นส่วนหนึ่งของสัญญา"}, {"index": 13, "text": "ข้อ 2  วัตถุประสงค์การเช่า"}, {"index": 14, "text": "2.1  ผู้เช่าใช้พื้นที่เพื่อ ........................................................................................ และจัดเก็บสินค้าหรือดำเนินกิจการที่ชอบด้วยกฎหมายเท่านั้น"}, {"index": 15, "text": "2.2  ห้ามใช้พื้นที่เพื่อกิจการผิดกฎหมาย หรือจัดเก็บวัตถุอันตราย วัตถุไวไฟ วัตถุระเบิด หรือสารเคมีอันตรายที่ไม่อยู่ในขอบเขตการใช้งานที่ตกลงกัน เว้นแต่ได้รับความยินยอมเป็นหนังสือจากผู้ให้เช่าและใบอนุญาตตามกฎหมายครบถ้วน"}, {"index": 16, "text": "2.3  ผู้เช่ารับผิดชอบใบอนุญาตสำหรับกิจการของตน และปฏิบัติตามกฎหมายด้านความปลอดภัยและสิ่งแวดล้อม โดยผู้ให้เช่าร่วมมือในส่วนเอกสารอาคารตามสมควร"}, {"index": 17, "text": "2.4  ผู้เช่าไม่มีสิทธิให้เช่าช่วงหรือโอนสิทธิการเช่าแก่บุคคลอื่นโดยไม่ได้รับความยินยอมเป็นหนังสือจากผู้ให้เช่า"}, {"index": 18, "text": "ข้อ 3  ระยะเวลาการเช่า"}, {"index": 19, "text": "3.1  มีกำหนด ............ ปี/เดือน ตั้งแต่วันที่ ................................................ ถึงวันที่ ................................................"}, {"index": 20, "text": "3.2  เมื่อครบกำหนดสัญญาย่อมสิ้นสุดลงตามระยะเวลาที่ตกลง เว้นแต่คู่สัญญาตกลงต่ออายุเป็นหนังสือ"}, {"index": 21, "text": "3.3  ผู้เช่าที่ประสงค์ต่ออายุสัญญาต้องแจ้งล่วงหน้าไม่น้อยกว่า 60 วันก่อนครบกำหนด โดยอัตราค่าเช่าและเงื่อนไขรอบใหม่ต้องได้รับความยินยอมของทั้งสองฝ่าย"}, {"index": 22, "text": "3.4  หากระยะเวลาการเช่าเข้าหลักเกณฑ์ที่ต้องจดทะเบียนเพื่อให้บังคับได้ตามกำหนดระยะเวลา คู่สัญญาจะร่วมกันดำเนินการให้ถูกต้องตามกฎหมาย"}, {"index": 23, "text": "ข้อ 4  ค่าเช่าและการชำระเงิน"}, {"index": 24, "text": "4.1  ค่าเช่าเดือนละ .................... บาท (........................................................................) [รวม/ไม่รวม] ภาษีมูลค่าเพิ่ม (หากมีตามกฎหมาย)"}, {"index": 25, "text": "4.2  ผู้เช่าชำระค่าเช่าล่วงหน้าเป็นรายเดือน ภายในวันที่ ............ ของทุกเดือน เข้าบัญชีธนาคารที่ผู้ให้เช่าแจ้งไว้เป็นหนังสือ"}, {"index": 26, "text": "4.3  หากผู้เช่ามีหน้าที่หักภาษี ณ ที่จ่ายตามกฎหมาย ให้หัก นำส่ง และออกหนังสือรับรองแก่ผู้ให้เช่าให้ถูกต้อง"}, {"index": 27, "text": "4.4  เมื่อผิดนัดชำระค่าเช่า ผู้ให้เช่าเรียกดอกเบี้ยผิดนัดได้ไม่เกินอัตราที่กฎหมายอนุญาต โดยไม่ตัดสิทธิการบอกเลิกสัญญาตามข้อ 13"}, {"index": 28, "text": "4.5  การรับชำระค่าเช่าที่ล่าช้าไม่ถือเป็นการสละสิทธิของผู้ให้เช่า เว้นแต่ตกลงเป็นหนังสือ"}, {"index": 29, "text": "ข้อ 5  เงินประกันความเสียหายและค่าเช่าล่วงหน้า"}, {"index": 30, "text": "5.1  เงินประกันความเสียหาย: ผู้เช่าวางเงิน .................... บาท เทียบเท่าค่าเช่า ............ เดือน เพื่อประกันหนี้และความเสียหายที่ผู้เช่าต้องรับผิดตามสัญญา เงินนี้ไม่ใช่ค่าเช่า และผู้เช่าไม่อาจนำไปชำระค่าเช่างวดสุดท้ายเอง เว้นแต่ผู้ให้เช่ายินยอมเป็นหนังสือ"}, {"index": 31, "text": "5.2  ค่าเช่าล่วงหน้า: ผู้เช่าชำระ .................... บาท สำหรับงวดค่าเช่า ................................................ โดยผู้ให้เช่าไม่เรียกเก็บซ้ำสำหรับงวดดังกล่าว"}, {"index": 32, "text": "5.3  เมื่อสิ้นสุดสัญญาและส่งมอบพื้นที่รวมทั้งกุญแจครบถ้วน ผู้ให้เช่าจะคืนเงินประกันส่วนที่เหลือภายใน 30 วันนับแต่วันส่งมอบ โดยหักได้เฉพาะค่าเช่าและค่าสาธารณูปโภคค้างชำระ ค่าเสียหายที่ผู้เช่าต้องรับผิด และหนี้ตามสัญญาที่มีหลักฐาน พร้อมแจ้งรายละเอียดการหักเงิน"}, {"index": 33, "text": "5.4  หากยังมีบิลค้างออกหรือค่าเสียหายที่ต้องประเมิน ผู้ให้เช่าอาจกันเงินไว้เฉพาะยอดที่มีเหตุผล พร้อมชี้แจงรายละเอียดและคืนเงินส่วนที่ไม่มีข้อโต้แย้งภายใน 30 วัน ส่วนที่กันไว้ให้สรุปและคืนส่วนเกินโดยเร็วเมื่อทราบยอดจริง"}, {"index": 34, "text": "5.5  ผู้ให้เช่าหักเงินประกันสำหรับความเสื่อมสภาพตามการใช้สอยปกติไม่ได้ และหากยอดหนี้หรือค่าเสียหายที่ผู้เช่าต้องรับผิดสูงกว่าเงินประกัน ผู้ให้เช่ายังมีสิทธิเรียกส่วนเกินตามกฎหมาย"}, {"index": 35, "text": "ข้อ 6  ภาษี อากรแสตมป์ และค่าธรรมเนียม"}, {"index": 36, "text": "6.1  ภาษีที่ดินและสิ่งปลูกสร้าง: โครงการโกดังสินค้าอันเป็นที่ตั้งของพื้นที่เช่าตามข้อ 1 ประกอบด้วยโกดังจำนวน 4 ห้อง คู่สัญญาตกลงให้ผู้เช่ารับภาระค่าใช้จ่ายภาษีที่ดินและสิ่งปลูกสร้างในสัดส่วนร้อยละ 25 (ยี่สิบห้า) ของยอดภาษีรวมทั้งโครงการดังกล่าวตามใบประเมินภาษีของหน่วยงานราชการ โดยแบ่งเท่ากันทั้ง 4 ห้องโดยไม่คำนึงถึงขนาดพื้นที่แต่ละห้อง ทั้งนี้ ยอดภาษีที่นำมาหารต้องเป็นยอดเฉพาะที่ดินและสิ่งปลูกสร้างในโครงการ 4 ห้องนี้เท่านั้น ไม่รวมทรัพย์สินหรือที่ดินแปลงอื่นของผู้ให้เช่า ผู้ให้เช่ายังคงเป็นผู้มีหน้าที่เสียภาษีต่อรัฐตามกฎหมาย และมีสิทธิเรียกเก็บเงินชดเชยภาระภาษีจากผู้เช่าตามข้อตกลงนี้"}, {"index": 37, "text": "6.2  ผู้ให้เช่าจะแสดงสำเนาใบประเมินหรือหลักฐานการชำระภาษีพร้อมรายละเอียดการคำนวณ และผู้เช่าต้องชำระเงินชดเชยภาษีภายใน 15 วันนับแต่ได้รับหนังสือเรียกเก็บ หากเริ่มหรือสิ้นสุดการเช่าระหว่างปี ให้คำนวณตามสัดส่วนจำนวนวันที่เช่าจริงในปีภาษีนั้น โดยยึดฐานร้อยละ 25 ของยอดประจำปี"}, {"index": 38, "text": "6.3  ผู้ให้เช่ารับผิดชอบภาษีเงินได้จากค่าเช่าของตน ส่วนผู้เช่ารับผิดชอบภาษีและค่าธรรมเนียมที่เกิดจากกิจการของตน รวมถึงหน้าที่หักภาษี ณ ที่จ่ายตามกฎหมาย"}, {"index": 39, "text": "6.4  ผู้ให้เช่ารับผิดชอบอากรแสตมป์สัญญาเช่า และคู่สัญญาร่วมมือดำเนินการตามกฎหมาย"}, {"index": 40, "text": "6.5  หากมีค่าธรรมเนียมจดทะเบียนการเช่า คู่สัญญารับผิดชอบฝ่ายละครึ่งหนึ่ง เว้นแต่ตกลงเป็นหนังสือเป็นอย่างอื่น ส่วนภาษีประเภทอื่นให้เป็นไปตามหน้าที่ทางกฎหมาย"}, {"index": 41, "text": "ข้อ 7  การประกันภัยและความรับผิดในทรัพย์สิน"}, {"index": 42, "text": "7.1  การประกันภัยตัวอาคารโดยผู้ให้เช่า ให้เป็นไปตามที่คู่สัญญาตกลงและระบุประเภทความคุ้มครองกับวงเงินในเอกสารแนบท้าย หากไม่มีข้อตกลง ไม่ถือว่าผู้ให้เช่ารับปากจัดให้มีกรมธรรม์ทุกประเภท"}, {"index": 43, "text": "7.2  ผู้เช่ารับผิดชอบการดูแลและพิจารณาประกันภัยสำหรับสินค้า เครื่องจักร อุปกรณ์ และทรัพย์สินของตน"}, {"index": 44, "text": "7.3  ความเสียหายต่อทรัพย์สินผู้เช่าที่มิได้เกิดจากความผิดหรือการฝ่าฝืนหน้าที่ของผู้ให้เช่า ไม่ทำให้ผู้ให้เช่าต้องรับผิดโดยอัตโนมัติ ทั้งนี้ไม่ตัดความรับผิดที่กฎหมายกำหนด"}, {"index": 45, "text": "7.4  ความเสียหายจากการกระทำ ความประมาท การติดตั้งอุปกรณ์หรือการฝ่าฝืนมาตรการความปลอดภัยของฝ่ายใด ให้ฝ่ายนั้นรับผิดตามกฎหมายและตามส่วนแห่งความเสียหาย"}, {"index": 46, "text": "7.5  คู่สัญญาต้องแจ้งเหตุที่เสี่ยงก่อความเสียหายแก่กันโดยเร็ว และร่วมมือป้องกันหรือบรรเทาความเสียหาย"}, {"index": 47, "text": "7.6  ผู้เช่าต้องรับผิดชอบมาตรการป้องกันและระงับอัคคีภัยในการประกอบกิจการของตน การใช้ไฟฟ้า เครื่องจักร การจัดเก็บสินค้า และการปฏิบัติตามกฎหมายหรือคำสั่งเจ้าพนักงานที่เกี่ยวข้องกับกิจการของผู้เช่า รวมทั้งจัดหาและดูแลอุปกรณ์ดับเพลิงที่กฎหมายกำหนดให้ผู้ประกอบกิจการต้องมี"}, {"index": 48, "text": "7.7  หากเกิดอัคคีภัย การระเบิด หรือความเสียหายจากการกระทำ การละเว้น การใช้พื้นที่หรืออุปกรณ์ของผู้เช่า ลูกจ้าง ผู้รับจ้าง หรือผู้ที่ผู้เช่าอนุญาตให้เข้าพื้นที่ ผู้เช่าต้องรับผิดชอบความเสียหายต่ออาคาร พื้นที่เช่า ทรัพย์สินของผู้อื่น และการเรียกร้องจากบุคคลภายนอกเท่าที่มีเหตุมาจากความผิดของบุคคลดังกล่าว โดยผู้ให้เช่าไม่ต้องร่วมรับผิดเพียงเพราะมีฐานะเป็นเจ้าของอาคาร เว้นแต่กฎหมายกำหนดให้ผู้ให้เช่าต้องรับผิดจากการกระทำหรือการละเลยหน้าที่ของตน"}, {"index": 49, "text": "7.8  ผู้เช่าต้องไม่ใช้หรือยินยอมให้บุคคลใดใช้พื้นที่เช่าเพื่อการกระทำที่ผิดกฎหมาย หากมีการกระทำผิดกฎหมายที่เกี่ยวข้องกับกิจการ สินค้า การดำเนินงาน หรือบุคคลของผู้เช่า ผู้เช่าต้องรับผิดชอบต่อการกระทำดังกล่าว รวมทั้งค่าปรับ ค่าเสียหาย และค่าใช้จ่ายที่เกิดขึ้นจากความผิดของตน และต้องชดใช้ความเสียหายแก่ผู้ให้เช่าตามที่พิสูจน์ได้จริง ทั้งนี้ ข้อตกลงนี้ไม่เป็นการยกเว้นความรับผิดของผู้ให้เช่าในกรณีที่ผู้ให้เช่ามีส่วนร่วม รู้เห็นเป็นใจ หรือมีหน้าที่รับผิดตามกฎหมาย"}, {"index": 50, "text": "7.9  หากผู้เช่าทราบหรือควรทราบถึงเหตุเพลิงไหม้ อันตราย หรือการกระทำผิดกฎหมายภายในพื้นที่เช่า ต้องรีบระงับเหตุเท่าที่ปลอดภัย แจ้งหน่วยงานที่เกี่ยวข้อง และแจ้งผู้ให้เช่าโดยไม่ชักช้า พร้อมให้ความร่วมมือในการตรวจสอบข้อเท็จจริง ทั้งนี้ไม่กระทบต่ออำนาจหน้าที่ของเจ้าพนักงานตามกฎหมาย"}, {"index": 51, "text": "ข้อ 8  เหตุสุดวิสัย"}, {"index": 52, "text": "8.1  เหตุสุดวิสัยหมายถึงเหตุที่ไม่อาจป้องกันได้แม้ได้ใช้ความระมัดระวังตามสมควร โดยพิจารณาตามหลักกฎหมายและพฤติการณ์จริง"}, {"index": 53, "text": "8.2  ฝ่ายที่ได้รับผลกระทบต้องแจ้งอีกฝ่ายโดยเร็ว และร่วมกันประเมินสภาพพื้นที่และแนวทางแก้ไข"}, {"index": 54, "text": "8.3  หากเหตุสุดวิสัยทำให้พื้นที่ทั้งหมดหรือบางส่วนใช้ประโยชน์ตามวัตถุประสงค์ไม่ได้ ให้ใช้สิทธิเกี่ยวกับค่าเช่า การลดค่าเช่า หรือการสิ้นสุดสัญญาตามลักษณะความเสียหายและกฎหมายที่เกี่ยวข้อง"}, {"index": 55, "text": "8.4  หากไม่อาจใช้พื้นที่ตามวัตถุประสงค์หลักติดต่อกันเกิน 60 วัน และไม่สามารถฟื้นฟูในเวลาอันสมควร คู่สัญญาฝ่ายใดฝ่ายหนึ่งอาจแจ้งเป็นหนังสือเพื่อยุติสัญญา ทั้งนี้ไม่ตัดสิทธิที่เกิดขึ้นก่อนหน้านั้นตามกฎหมาย"}, {"index": 56, "text": "8.5  ฝ่ายหนึ่งไม่ต้องชดเชยการสูญเสียรายได้หรือโอกาสทางธุรกิจของอีกฝ่ายโดยอัตโนมัติ เว้นแต่มีความรับผิดตามกฎหมายหรือสัญญา"}, {"index": 57, "text": "ข้อ 9  การบำรุงรักษาและซ่อมแซม"}, {"index": 58, "text": "9.1  ผู้ให้เช่ารับผิดชอบการซ่อมแซมที่จำเป็นของโครงสร้างหลักหรือส่วนของอาคารเดิม เช่น เสา คาน ฐานราก หลังคารั่วจากการเสื่อมสภาพ พื้นทรุดจากข้อบกพร่องโครงสร้างเดิม ผนังโครงสร้าง และระบบหลักเดิมที่ชำรุดจากการใช้ตามปกติ โดยไม่รวมความเสียหายที่เกิดจากผู้เช่าหรือบุคคลที่ผู้เช่าอนุญาตให้เข้าพื้นที่"}, {"index": 59, "text": "9.2  ผู้เช่ารับผิดชอบการดูแลรักษาทั่วไปและการซ่อมแซมเล็กน้อย รวมถึงความเสียหายจากการใช้ผิดประเภท การวางน้ำหนักเกิน การใช้รถยกหรือเครื่องจักร การเจาะพื้น/หลังคา หรือการดัดแปลงโดยไม่ได้รับอนุญาต"}, {"index": 60, "text": "9.3  ผู้เช่าแจ้งความชำรุดที่อยู่ในหน้าที่ผู้ให้เช่าโดยเร็ว พร้อมภาพหรือข้อมูลตามสมควร ผู้ให้เช่าจะตรวจสอบหรือประสานช่างภายใน 7 วันหลังรับแจ้งสำหรับเหตุทั่วไป และซ่อมแซมภายในเวลาที่เหมาะสมตามลักษณะงาน"}, {"index": 61, "text": "9.4  เหตุฉุกเฉินที่กระทบความปลอดภัย ผู้ให้เช่าต้องประสานแก้ไขโดยเร็วที่สุด ผู้เช่าให้ความร่วมมือในการเข้าซ่อม หากผู้เช่าจำเป็นต้องดำเนินการเฉพาะหน้าป้องกันความเสียหายร้ายแรง ให้แจ้งผู้ให้เช่าโดยเร็วและเก็บหลักฐานค่าใช้จ่าย"}, {"index": 62, "text": "9.5  ผู้เช่าอนุญาตให้ผู้ให้เช่าหรือช่างเข้าตรวจและซ่อมตามเวลาที่นัดหมายกัน เว้นแต่เป็นเหตุฉุกเฉิน"}, {"index": 63, "text": "ข้อ 10  การดัดแปลง ต่อเติม และติดตั้งอุปกรณ์"}, {"index": 64, "text": "10.1  ผู้เช่าต้องได้รับอนุญาตเป็นหนังสือก่อนดัดแปลง ต่อเติม เจาะพื้น ผนัง หรือหลังคา ติดตั้งระบบไฟฟ้าเพิ่มเติม หรือกระทำการที่อาจกระทบระบบหลักและความปลอดภัยของอาคาร"}, {"index": 65, "text": "10.2  ผู้เช่ารับผิดชอบค่าใช้จ่ายในการดัดแปลงของตน เว้นแต่ตกลงเป็นอย่างอื่น"}, {"index": 66, "text": "10.3  เมื่อสิ้นสุดสัญญา ผู้เช่าต้องรื้อถอนสิ่งติดตั้งของตนและคืนสภาพตามหนังสืออนุญาต เว้นแต่ผู้ให้เช่าตกลงให้คงไว้ โดยต้องหลีกเลี่ยงความเสียหายต่อโครงสร้าง"}, {"index": 67, "text": "ข้อ 11  ค่าน้ำ ค่าไฟ และสาธารณูปโภค"}, {"index": 68, "text": "11.1  ผู้เช่ารับผิดชอบค่าน้ำ ไฟ อินเทอร์เน็ต ขยะ และค่าบริการที่เกิดจากการใช้พื้นที่ของตน"}, {"index": 69, "text": "11.2  กรณีมีมิเตอร์ย่อย ให้คิดตามหน่วยใช้จริงและวิธีคำนวณที่ตกลงในเอกสารแนบท้าย แสดงหน่วย อัตรา และรายละเอียดที่ตรวจสอบได้ โดยต้องปฏิบัติตามกฎหมายที่เกี่ยวข้อง"}, {"index": 70, "text": "11.3  ค่าใช้จ่ายส่วนกลางหรือบริการอื่นเพิ่มเติมต้องกำหนดไว้ในสัญญาหรือได้รับความยินยอมเป็นหนังสือ"}, {"index": 71, "text": "11.4  เมื่อสิ้นสุดสัญญา ผู้เช่าต้องชำระค่าสาธารณูปโภคจนถึงวันส่งมอบพื้นที่จริง"}, {"index": 72, "text": "ข้อ 12  สิทธิเข้าตรวจสอบพื้นที่"}, {"index": 73, "text": "12.1  ผู้ให้เช่าเข้าตรวจอาคาร ระบบน้ำ ระบบไฟ และการปฏิบัติตามสัญญาได้โดยแจ้งล่วงหน้าไม่น้อยกว่า 24 ชั่วโมง และเข้าภายในเวลาอันสมควร"}, {"index": 74, "text": "12.2  กรณีฉุกเฉินที่เสี่ยงต่อชีวิต ทรัพย์สิน หรือโครงสร้างอาคาร สามารถเข้าดำเนินการเท่าที่จำเป็นตามกฎหมาย โดยแจ้งผู้เช่าโดยเร็ว"}, {"index": 75, "text": "12.3  การตรวจต้องไม่รบกวนกิจการผู้เช่าเกินสมควร"}, {"index": 76, "text": "ข้อ 13  การผิดสัญญาและการบอกเลิก"}, {"index": 77, "text": "13.1  หากผู้เช่าค้างค่าเช่ารายเดือน ผู้ให้เช่าจะมีหนังสือบอกกล่าวให้ชำระโดยให้เวลาไม่น้อยกว่า 15 วันก่อนใช้สิทธิบอกเลิกตามกฎหมาย"}, {"index": 78, "text": "13.2  หากผู้เช่าฝ่าฝืนเงื่อนไขสำคัญอื่น ผู้ให้เช่าแจ้งให้แก้ไขภายใน 30 วัน เว้นแต่กรณีไม่อาจแก้ไขได้หรือกฎหมายกำหนดเป็นอย่างอื่น และใช้สิทธิบอกเลิกกับเรียกค่าเสียหายได้เมื่อเข้าเงื่อนไขตามกฎหมาย"}, {"index": 79, "text": "13.3  หากผู้ให้เช่าผิดหน้าที่สำคัญจนผู้เช่าใช้พื้นที่ตามวัตถุประสงค์หลักไม่ได้ ผู้เช่ามีสิทธิแจ้งให้แก้ไขภายในเวลาอันสมควร และใช้สิทธิตามกฎหมายหากไม่แก้ไข"}, {"index": 80, "text": "13.4  หากผู้เช่าประสงค์ออกก่อนครบกำหนดโดยไม่มีเหตุจากการผิดสัญญาของผู้ให้เช่า ต้องแจ้งเป็นหนังสือล่วงหน้าอย่างน้อย 60 วัน และได้รับความยินยอมเป็นหนังสือจากผู้ให้เช่า การแจ้งอย่างเดียวไม่ทำให้สัญญาสิ้นสุดอัตโนมัติ ทั้งสองฝ่ายจะตกลงค่าเสียหายหรือค่าชดเชยที่เหมาะสมแยกเป็นหนังสือ"}, {"index": 81, "text": "13.5  การออกก่อนกำหนดไม่เป็นเหตุให้ริบเงินประกันทั้งหมดโดยอัตโนมัติ ผู้ให้เช่าหักได้เฉพาะหนี้หรือค่าเสียหายที่ผู้เช่าต้องรับผิดตามสัญญาและกฎหมาย"}, {"index": 82, "text": "13.6  ผู้ให้เช่าจะยุติสัญญาก่อนกำหนดโดยไม่มีเหตุชอบด้วยสัญญาหรือกฎหมายไม่ได้ เว้นแต่ได้รับความยินยอมจากผู้เช่าและตกลงเงื่อนไขกันเป็นหนังสือ"}, {"index": 83, "text": "ข้อ 14  การส่งมอบคืนพื้นที่"}, {"index": 84, "text": "14.1  เมื่อสัญญาสิ้นสุด ผู้เช่าต้องขนย้ายสินค้าและทรัพย์สินออก ส่งคืนกุญแจ อุปกรณ์ และพื้นที่ภายในวันที่สิ้นสุดหรือวันที่ตกลงกันเป็นหนังสือ"}, {"index": 85, "text": "14.2  ส่งคืนในสภาพเรียบร้อย โดยไม่ต้องรับผิดชอบการเสื่อมสภาพตามปกติหรือความบกพร่องของโครงสร้างที่ไม่ได้เกิดจากผู้เช่า"}, {"index": 86, "text": "14.3  คู่สัญญาร่วมตรวจรับและทำบันทึกส่งคืนพร้อมภาพถ่าย ระบุความเสียหายและข้อโต้แย้งหากมี"}, {"index": 87, "text": "14.4  หากพบความเสียหายที่ผู้เช่าต้องรับผิด ผู้ให้เช่าเรียกค่าซ่อมจริงที่สมเหตุสมผลพร้อมหลักฐานได้"}, {"index": 88, "text": "14.5  หากส่งมอบล่าช้าโดยไม่มีสิทธิอยู่ต่อ ผู้ให้เช่าเรียกค่าขาดประโยชน์หรือความเสียหายตามกฎหมายได้ โดยการรับเงินไม่ถือเป็นการต่อสัญญาโดยอัตโนมัติ"}, {"index": 89, "text": "14.6  ทรัพย์สินที่ผู้เช่าทิ้งไว้ต้องดำเนินการตามกฎหมาย โดยผู้ให้เช่าแจ้งผู้เช่าให้มารับคืนภายในเวลาอันเหมาะสมก่อน ไม่ถือว่าตกเป็นกรรมสิทธิ์ผู้ให้เช่าอัตโนมัติ"}, {"index": 90, "text": "ข้อ 15  การติดต่อและหนังสือแจ้ง"}, {"index": 91, "text": "15.1  ที่อยู่และช่องทางติดต่อผู้ให้เช่า: ........................................................................................ โทรศัพท์ ................................................ อีเมล ................................................"}, {"index": 92, "text": "15.2  ที่อยู่และช่องทางติดต่อผู้เช่า: ........................................................................................ โทรศัพท์ ................................................ อีเมล ................................................"}, {"index": 93, "text": "15.3  หนังสือแจ้งสำคัญ เช่น การบอกเลิกสัญญา ต้องส่งทางที่พิสูจน์การรับได้ การแจ้งทางอิเล็กทรอนิกส์ใช้ได้เมื่อมีหลักฐานการรับที่ตรวจสอบได้"}, {"index": 94, "text": "15.4  คู่สัญญาต้องแจ้งการเปลี่ยนที่อยู่หรือช่องทางติดต่อเป็นหนังสือ"}, {"index": 95, "text": "ข้อ 16  ข้อตกลงทั่วไป"}, {"index": 96, "text": "16.1  การแก้ไขสัญญาต้องทำเป็นหนังสือและได้รับความยินยอมของทั้งสองฝ่าย"}, {"index": 97, "text": "16.2  หากข้อใดใช้บังคับไม่ได้ ข้ออื่นที่ชอบด้วยกฎหมายยังคงมีผล"}, {"index": 98, "text": "16.3  ข้อพิพาทให้เจรจาโดยสุจริตก่อน หากไม่อาจตกลงกันได้ ให้ใช้กฎหมายไทยและกระบวนการตามกฎหมาย"}, {"index": 99, "text": "16.4  เอกสารแนบท้ายที่ทั้งสองฝ่ายลงนามรับรองถือเป็นส่วนหนึ่งของสัญญา"}, {"index": 100, "text": "ข้อ 17  การลงนาม"}, {"index": 101, "text": "คู่สัญญาทั้งสองฝ่ายได้อ่าน ตรวจสอบ และเข้าใจข้อความในสัญญาและเอกสารแนบท้ายทั้งหมดแล้ว เห็นว่าตรงตามเจตนาของตน จึงลงลายมือชื่อไว้เป็นหลักฐาน โดยคู่สัญญาต่างได้รับสัญญาที่มีข้อความตรงกันฝ่ายละหนึ่งฉบับ"}, {"index": 102, "text": "ลงชื่อ ........................................................ ผู้ให้เช่า"}, {"index": 103, "text": "       (........................................................)"}, {"index": 104, "text": "ลงชื่อ ........................................................ ผู้เช่า"}, {"index": 105, "text": "       (........................................................)"}, {"index": 106, "text": "ลงชื่อ ........................................................ พยาน"}, {"index": 107, "text": "       (........................................................)"}, {"index": 108, "text": "ลงชื่อ ........................................................ พยาน"}, {"index": 109, "text": "       (........................................................)"}, {"index": 110, "text": "ข้อ แนบท้าย  เอกสารประกอบสัญญา"}, {"index": 111, "text": "☐  แผนผังและรายละเอียดพื้นที่เช่า"}, {"index": 112, "text": "☐  ภาพถ่ายสภาพโกดัง ณ วันส่งมอบ"}, {"index": 113, "text": "☐  รายการอุปกรณ์และกุญแจ"}, {"index": 114, "text": "☐  เลขมิเตอร์น้ำและไฟฟ้า ณ วันส่งมอบ"}, {"index": 115, "text": "☐  สูตรค่าน้ำ ค่าไฟ และค่าใช้จ่ายที่ตกลงกัน"}, {"index": 116, "text": "☐  ข้อกำหนดการรับน้ำหนักพื้นและการใช้โกดัง (ถ้ามี)"}, {"index": 117, "text": "☐  รายละเอียดกรมธรรม์ประกันภัยอาคาร (ถ้ามี)"}, {"index": 118, "text": "☐  หนังสืออนุญาตดัดแปลงหรือต่อเติม (ถ้ามี)"}]};

var WarehouseLease=(()=>{
const version=WarehouseLeaseTemplate.version,months=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
function thaiDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return'';let [y,m,d]=s.split('-').map(Number);return d+' '+months[m-1]+' พ.ศ. '+(y+543);}
function baht(value){let v=Math.round(Number(value)*100);if(!Number.isFinite(v)||v<0)return'';const words=['ศูนย์','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],positions=['','สิบ','ร้อย','พัน','หมื่น','แสน'];function read(n){if(n>=1000000)return read(Math.floor(n/1000000))+'ล้าน'+(n%1000000?read(n%1000000):'');let text='',digits=String(n);for(let i=0;i<digits.length;i++){let d=Number(digits[i]),p=digits.length-i-1;if(!d)continue;if(p===1)text+=(d===1?'':d===2?'ยี่':words[d])+'สิบ';else text+=(p===0&&d===1&&digits.length>1?'เอ็ด':words[d])+positions[p];}return text||'ศูนย์';}return read(Math.floor(v/100))+'บาท'+(v%100?read(v%100)+'สตางค์':'ถ้วน');}
function build(db,c,options={}){let r=db.rooms.find(r=>r.id===c.roomId)||{},t=db.tenants.find(t=>t.id===c.tenantId)||{},o=db.owner||{},missing=[];const need=(value,label)=>{if(value==null||String(value).trim()==='')missing.push(label);return value==null?'':String(value).trim();};const money=v=>v==null||v===''?'':Number(v).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});let tenantName=((t.prefix||'')+(t.fname||'')+' '+(t.lname||'')).trim(),signed=c.signedDate||'',parts=signed.split('-').map(Number),year=Number.isFinite(parts[0])?parts[0]+543:'',signedMonth=months[(parts[1]||0)-1]||'';
let ownerId=o.idcard||o.taxId||o.registrationNo||'',tenantId=t.idcard||t.taxId||t.registrationNo||t.docno||'',tenantAddress=t.address||t.addressId||'',ownerSigner=c.ownerSigner||o.signer||'',tenantSigner=c.tenantSigner||t.signer||'';let annual=Number(c.termYears)||LeaseFields.inferYears(c),duration=c.durationText||annual+' ปี';let vat=['รวม','ไม่รวม'].includes(c.rentVatMode)?c.rentVatMode:'';let rent=need(c.rent,'ค่าเช่ารายเดือน'),deposit=need(c.deposit,'เงินประกัน'),advance=need(c.advance,'ค่าเช่าล่วงหน้า');need(c.number,'เลขที่สัญญา');need(signed,'วันทำสัญญา');need(c.startDate,'วันเริ่มสัญญา');need(c.endDate,'วันสิ้นสุดสัญญา');need(vat,'การรวม / ไม่รวม VAT ในค่าเช่า');

nel('งานที่ต้องดูแล','<div class="task"><span class="circle">'+icon(cycle?.state==='issued'?'check':'billing')+'</span><div><b>'+(cycle?.state==='issued'?'ออกบิลรอบนี้แล้ว '+current.length+' หลัง':'เตรียมบิลรอบ '+month(period))+'</b><p>'+(cycle?.state==='issued'?'บันทึกมิเตอร์และต้นทุนไว้กับบิลแล้ว':'ใส่บิลน้ำ–ไฟหลัก แล้วจดมิเตอร์ย่อยให้ครบ')+'</p></div>'+btn('เปิดดู','go-billing','small')+'</div><div class="task"><span class="circle">'+icon('clock')+'</span><div><b>ใบแจ้งหนี้เกินกำหนด '+late.length+' ใบ</b><p>ยอดที่ต้องติดตาม '+M(late.reduce((s,i)=>s+RP.balance(db,i),0))+' บาท</p></div>'+btn('ติดตาม','show-overdue','small')+'</div><div class="task"><span class="circle">'+icon('properties')+'</span><div style="width:100%"><b>อัตราการเช่า '+(rooms.length?Math.round(occupied/rooms.length*100):0)+'%</b><div class="progress-line"><span style="width:'+(rooms.length?occupied/rooms.length*100:0)+'%"></span></div><p>มีผู้เช่า '+occupied+' หลัง · ว่าง '+(rooms.length-occupied)+' หลัง</p></div></div>')+'</div></div>';}
function emptyBill(){return {units:'',usage:'',service:0,ft:0,tax:0,discount:0,billAmount:'',from:'',to:'',reference:'',attachment:null};}
function getWorking(){if(working&&working.period===period)return working;let c=currentCycle();let cached=rpStore.getItem(draftPrefix()+period);working=C(c||{id:uid(),period,state:'draft',due:'',note:'',water:emptyBill(),electric:emptyBill(),rows:activeRooms().map(r=>{let prev=db.rp3.cycles.filter(x=>x.state==='issued'&&x.period<period&&x.rows.some(y=>y.roomId===r.id)).sort((a,b)=>b.period.localeCompare(a.period))[0]?.rows.find(x=>x.roomId===r.id);return {roomId:r.id,waterPrev:prev?.waterNow??'',waterNow:'',electricPrev:prev?.electricNow??'',electricNow:''};})});if(!c&&cached){try{working=JSON.parse(cached);}catch{}}return working;}
function draftPrefix(){return demo?'rentpro_demo_draft_':'rentpro_draft_'+(currentUser?.id||'legacy')+'_';}
function cacheDraft(){if(working&&working.state==='draft'&&(demo||currentUser)){rpStore.setItem(draftPrefix()+period,JSON.stringify(working));let idx=db.rp3.cycles.findIndex(c=>c.id===working.id);if(idx<0||JSON.stringify(db.rp3.cycles[idx])!==JSON.stringify(working)){if(idx<0)db.rp3.cycles.push(C(working));else db.rp3.cycles[idx]=C(working);save('บันทึกร่างบิลอัตโนมัติ',working.id);}}}

window.addEventListener('rentpro-storage-error',e=>{cloudError='บันทึกในเครื่องไม่สำเร็จ: '+e.detail;renderStatus();toast(cloudError+' กรุณาดาวน์โหลดสำรอง');});
async function refreshCloud(){if(demo||!currentUser||authLoading||busy||working||$('modal')||document.visibilityState==='hidden')return;try{if(isDirty()){await sync();return;}if(await RPOnline.changed(onlineRevision)){let result=await RPOnline.read();if(result.ownerId!==currentUser?.id)return;if(result.data){db=RP.merge(base,db,result.data);base=C(db);knownBase=true;onlineRevision=result.revision;rpStore.setItem('rentpro_v2',JSON.stringify(db));persistAccount();cloudReady=true;cloudError='';render();}}}catch(e){cloudError=authMessage(e);renderStatus();}}
setInterval(refreshCloud,15000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')cacheDraft();else refreshCloud();});window.addEventListener('beforeunload',cacheDraft);window.addEventListener('online',()=>{if(!demo&&currentUser)sync().catch(()=>{});});
if(demo){rpStore.setItem('rentpro_demo_v4',JSON.stringify(db));render();}else await openAccount();
})();

</script></body></html>
